name: Build APK

on:
  workflow_dispatch:
  push:
    # test: builds for trying things out. They go to a draft release that only the repo owner sees,
    # do not take a release number and are never offered to users (see "Pick the build number" and the end).
    branches: [master, main, test]
    paths-ignore:
      - '**.md'
      - 'proxies.json'
      - '.github/scripts/**'
      - '.github/workflows/update-proxies.yml'
      - '.github/workflows/channel-posts.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # Release: previous release + 1, so test runs leave no gaps in the numbers people see.
      # Test: the current release number (so the next release is still offered) plus the TELEZHKA_TEST flag.
      - name: Pick the build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null | sed -n -E 's/^build-([0-9]+)$/\1/p')
          if [ "${{ github.ref_name }}" = "test" ]; then
            BUILD=${LATEST:-0}
            TAG="test-${{ github.run_id }}"
            APK="Telezhka-test-${GITHUB_SHA::7}.apk"
          else
            if [ -n "$LATEST" ]; then
              BUILD=$((LATEST + 1))
            else
              echo "::warning::Could not read the latest release, falling back to the run number"
              BUILD=${{ github.run_number }}
            fi
            TAG="build-$BUILD"
            APK="Telezhka-$BUILD.apk"
          fi
          {
            echo "BUILD=$BUILD"
            echo "TAG=$TAG"
            echo "APK=$APK"
            echo "SHORT_SHA=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"
          echo "latest release: ${LATEST:-none}, this build: $BUILD, tag: $TAG, apk: $APK"

      - name: Insert API keys and proxy list URL
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PROXY_LIST_URL: ${{ vars.PROXY_LIST_URL }}
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            # Temporary: builds with the official keys from BuildVars until own keys are added.
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set, using the official keys from BuildVars. Get your own at https://my.telegram.org"
          else
            if ! [[ "$API_ID" =~ ^[0-9]+$ ]] || ! [[ "$API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
              echo "::error::TELEGRAM_API_ID must be a number and TELEGRAM_API_HASH 32 hex characters"
              exit 1
            fi
            sed -i -E "s/(public static int APP_ID = )[0-9]+;/\1$API_ID;/" "$FILE"
            sed -i -E "s/(public static String APP_HASH = )\"[0-9a-f]+\";/\1\"$API_HASH\";/" "$FILE"
          fi
          if [ -n "$PROXY_LIST_URL" ]; then
            if ! [[ "$PROXY_LIST_URL" =~ ^https?://[^\"\\]+$ ]]; then
              echo "::error::PROXY_LIST_URL must start with http:// or https://"
              exit 1
            fi
            URL_ESCAPED=$(printf '%s' "$PROXY_LIST_URL" | sed 's/[&|]/\\&/g')
            sed -i -E "s|(public static String PROXY_LIST_URL = )\"[^\"]*\";|\1\"$URL_ESCAPED\";|" "$FILE"
          fi
          sed -i -E "s/(public static int TELEZHKA_BUILD = )[0-9]+;/\1$BUILD;/" "$FILE"
          if [ "${{ github.ref_name }}" = "test" ]; then
            sed -i -E "s/(public static boolean TELEZHKA_TEST = )false;/\1true;/" "$FILE"
          fi
          grep -n "APP_ID =\|PROXY_LIST_URL =\|TELEZHKA_BUILD =\|TELEZHKA_TEST =" "$FILE"

      - name: Use own signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TELEZHKA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TELEZHKA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::TELEZHKA_KEYSTORE_* secrets are not set, signing with the public test key from the Telegram sources"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=telezhka"
          } >> "$GITHUB_ENV"
          echo "Signing with the Telezhka key"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-arm64
          max-size: 2G

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          USE_CCACHE: '1'
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n 1)" "out/$APK"
          if [ "${{ github.ref_name }}" != "test" ]; then
            # same file under a fixed name: the site links to releases/latest/download/Telezhka.apk
            cp "out/$APK" out/Telezhka.apk
          fi
          ls -la out

      - name: Release notes
        # "- " lines of the commit message become the list in the in-app update popup
        run: |
          {
            if [ "${{ github.ref_name }}" = "test" ]; then
              echo "Тестовая сборка из ветки test (коммит ${GITHUB_SHA::7}). Это черновик: его видите только вы, пользователям он не приходит."
              echo
            fi
            echo "APK для установки на Android. Скачайте файл .apk ниже."
            echo
            git log -1 --format=%B | grep -E '^- ' | head -n 4 || true
          } > out/notes.md
          cat out/notes.md
          if [ "${{ github.ref_name }}" = "test" ]; then
            exit 0
          fi
          # update.json for the in-app updater (read without the GitHub API rate limit)
          python3 - "$APK" "$BUILD" "${{ github.repository }}" <<'PY'
          import json, os, subprocess, sys
          apk, build, repo = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          msg = subprocess.run(["git", "log", "-1", "--format=%B"], capture_output=True, text=True).stdout
          notes = [l[2:].strip() for l in msg.splitlines() if l.startswith("- ")][:4]
          data = {"build": build, "apk": f"https://github.com/{repo}/releases/download/build-{build}/{apk}",
                  "size": os.path.getsize(f"out/{apk}"), "notes": notes}
          json.dump(data, open("out/update.json", "w"), ensure_ascii=False)
          print(data)
          PY

      # Artifacts of a public repo can be downloaded by anyone signed in to GitHub, so test builds skip this.
      - uses: actions/upload-artifact@v4
        if: github.ref_name != 'test'
        with:
          name: Telezhka-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref_name != 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Сборка ${{ env.BUILD }}
          body_path: out/notes.md
          files: |
            out/*.apk
            out/update.json

      # The test branch: a draft release. Drafts are seen only by people with write access to the repo,
      # releases/latest never returns them (so neither the in-app updater nor the site sees it),
      # and it has no number. Download the APK from the Releases page while signed in to GitHub.
      - name: Remove older test drafts
        if: github.ref_name == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft and (.tag_name | startswith("test-"))) | .id' |
          while read -r id; do
            echo "Deleting old test draft $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

      - name: Publish test build
        if: github.ref_name == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Тестовая сборка · ${{ env.SHORT_SHA }}
          body_path: out/notes.md
          draft: true
          make_latest: false
          files: |
            out/${{ env.APK }}
