name: Update proxies

# Every 30 minutes: read the public Telegram channels with proxies and refresh proxies.json.
# The app downloads this file on every pick, so the list stays fresh without rebuilding.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: update-proxies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            proxies.json
            .github/scripts
          sparse-checkout-cone-mode: false

      # Telethon reads the channels through a separate Telegram account (TG_SESSION, made once with
      # .github/scripts/make_session.py). Without the secret the script falls back to the web preview.
      - name: Install Telethon
        run: pip install --quiet "telethon>=1.36,<2"

      - name: Collect proxies from channels
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID || secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || secrets.TELEGRAM_API_HASH }}
        run: python3 .github/scripts/update_proxies.py proxies.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- proxies.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add proxies.json
          git commit -m "Update proxies.json ($(grep -c '"server"' proxies.json) proxies)"
          git push
